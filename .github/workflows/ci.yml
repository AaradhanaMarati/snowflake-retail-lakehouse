name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Verify sample data is reproducible
        run: |
          python scripts/generate_sample_data.py --out /tmp/regen
          diff -r /tmp/regen data/raw

      - name: Run tests (data contract, pipeline logic, SQL static checks)
        run: pytest -v

      - name: Build preview report
        run: python scripts/local_preview.py
